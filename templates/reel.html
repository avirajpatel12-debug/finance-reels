<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Nunito; font-weight: 800; src: url(../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: Nunito; font-weight: 900; src: url(../node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2) format('woff2'); }
  :root { --paper: #F6EBDD; --card: #FFF9F0; --ink: #2B1B17; --maroon: #8E2F33; --up: #2E9460; --down: #D2402F; --flat: #8A7F78; --muted: #6E5F58; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: Nunito, 'Arial Rounded MT Bold', sans-serif; font-weight: 800; }
  #stage { position: absolute; inset: 0; background: radial-gradient(circle at 12px 12px, rgba(43,27,23,.07) 3px, transparent 3.5px) 0 0 / 28px 28px, var(--paper); }
  #head { position: absolute; top: 150px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: flex-end; }
  #head .t { white-space: nowrap; font-size: 50px; font-weight: 900; color: var(--maroon); letter-spacing: 1px; text-transform: uppercase; }
  #head .d { white-space: nowrap; font-size: 30px; color: var(--muted); padding-bottom: 6px; margin-left: 24px; }
  #rule { position: absolute; top: 236px; left: 64px; right: 64px; height: 8px; background: var(--ink); border-radius: 4px; }
  .scene { position: absolute; top: 280px; left: 64px; right: 64px; height: 1010px; opacity: 0; transform-origin: 50% 40%; }
  .heading { font-size: 64px; font-weight: 900; line-height: 1.05; }
  .note { font-size: 30px; color: var(--muted); margin-top: 8px; }
  .card { background: var(--card); border: 7px solid var(--ink); border-radius: 34px; box-shadow: 12px 12px 0 var(--ink); }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
  .bg-up { background: var(--up); } .bg-down { background: var(--down); } .bg-flat { background: var(--flat); }
  /* hero */
  .hero .card { margin-top: 20px; padding: 44px 48px 40px; }
  .hero .label { font-size: 60px; font-weight: 900; }
  .hero .big { font-size: 230px; font-weight: 900; line-height: 1; margin: 6px 0 4px; letter-spacing: -4px; }
  .hero .sub { font-size: 32px; color: var(--muted); }
  .hero svg { display: block; margin-top: 34px; width: 100%; height: 330px; }
  .hero .sl { font-size: 28px; color: var(--muted); margin-top: 14px; }
  /* bars */
  .rows { margin-top: 34px; display: flex; flex-direction: column; gap: 26px; }
  .row { padding: 26px 34px 28px; }
  .row .top { display: flex; justify-content: space-between; align-items: baseline; }
  .row .name { font-size: 54px; font-weight: 900; }
  .row .name small { font-size: 28px; color: var(--muted); margin-left: 14px; font-weight: 800; }
  .row .val { font-size: 62px; font-weight: 900; }
  .track { height: 26px; margin-top: 16px; background: rgba(43,27,23,.12); border-radius: 13px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 13px; }
  .compact .rows { gap: 7px; margin-top: 14px; }
  .compact .row { padding: 5px 22px 8px; border-width: 4px; border-radius: 18px; box-shadow: 5px 5px 0 var(--ink); }
  .compact .row .name { font-size: 33px; } .compact .row .name small { font-size: 20px; }
  .compact .row .val { font-size: 36px; }
  .compact .track { height: 9px; margin-top: 2px; }
  /* stats */
  .tiles { margin-top: 34px; display: flex; flex-direction: column; gap: 28px; }
  .tile { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; }
  .tile .l { font-size: 52px; font-weight: 900; } .tile .h { font-size: 30px; color: var(--muted); }
  .tile .v { font-size: 100px; font-weight: 900; color: var(--maroon); text-align: right; line-height: 1; }
  .tile .p { font-size: 28px; color: var(--muted); text-align: right; margin-top: 8px; }
  /* outro */
  .outro { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 30px; }
  .outro .line { font-size: 84px; font-weight: 900; line-height: 1.08; }
  .outro .line:nth-child(2) { color: var(--maroon); font-size: 64px; }
  /* which part of the story this scene is */
  .pill { display: inline-block; font-size: 30px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: #fff; background: var(--maroon); border: 5px solid var(--ink); border-radius: 999px; padding: 6px 24px 8px; margin-bottom: 26px; box-shadow: 5px 5px 0 var(--ink); }
  /* headline */
  .hl-card { padding: 0; overflow: hidden; }
  .hl-card .kick { background: var(--ink); color: var(--paper); font-size: 30px; letter-spacing: 4px; padding: 14px 48px; text-transform: uppercase; }
  .hl-card .hl { font-size: 86px; font-weight: 900; line-height: 1.06; padding: 44px 48px 10px; }
  .hl-card .srcs { font-size: 34px; color: var(--muted); padding: 10px 48px 44px; }
  /* one big number */
  .stat-card { padding: 44px 48px 40px; }
  .stat-card .label { font-size: 54px; font-weight: 900; line-height: 1.1; }
  .stat-card .big { font-size: 190px; font-weight: 900; line-height: 1; margin: 18px 0 10px; letter-spacing: -3px; color: var(--maroon); }
  .stat-card .big.up { color: var(--up); } .stat-card .big.down { color: var(--down); }
  .stat-card .context { font-size: 42px; line-height: 1.2; }
  .stat-card svg { display: block; margin-top: 26px; width: 100%; height: 230px; }
  .stat-card .date { font-size: 28px; color: var(--muted); margin-top: 14px; }
  /* ripple: cause and effects */
  .from { padding: 34px 40px 38px; font-size: 64px; font-weight: 900; line-height: 1.1; text-align: center; background: var(--maroon); color: #fff; }
  .ripple .down-arrow { display: block; margin: 18px auto; }
  .tos { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .to { padding: 26px 24px 30px; text-align: center; }
  .to .n { font-size: 40px; font-weight: 900; line-height: 1.1; min-height: 88px; display: flex; align-items: center; justify-content: center; }
  .to .v { font-size: 82px; font-weight: 900; margin-top: 8px; }
  /* what to watch */
  .items { margin-top: 30px; display: flex; flex-direction: column; gap: 28px; }
  .item { padding: 30px 36px; display: flex; gap: 30px; align-items: center; }
  .item svg { flex: none; }
  .item .n { font-size: 54px; font-weight: 900; line-height: 1.1; }
  .item .w { font-size: 38px; color: var(--muted); margin-top: 6px; }
  /* captions: bold white, dark outline, spoken words bright and upcoming words dim */
  #cap { position: absolute; left: 40px; right: 40px; top: 1450px; text-align: center; font-size: 78px; font-weight: 900; line-height: 1.1; }
  #cap span { color: #CFC4BA; -webkit-text-stroke: 11px var(--ink); paint-order: stroke fill; margin: 0 11px; letter-spacing: 1.5px; display: inline-block; }
  #cap span.on { color: #fff; }
  #foot { position: absolute; left: 64px; right: 64px; bottom: 150px; display: flex; justify-content: space-between; font-size: 28px; color: var(--muted); border-top: 5px solid rgba(43,27,23,.25); padding-top: 16px; }
  #bar { position: absolute; left: 0; bottom: 0; height: 12px; background: var(--maroon); width: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="head"><div class="t"></div><div class="d"></div></div><div id="rule"></div>
  <div id="scenes"></div>
  <div id="cap"></div>
  <div id="foot"><div class="s"></div><div class="a"></div></div>
  <div id="bar"></div>
</div>
<script>
// Everything on screen is a pure function of the time t, so any frame can be drawn on its own.
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const cls = (m) => (m > 0 ? 'up' : m < 0 ? 'down' : 'flat');
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
let R, chunks = [];

// A small line chart that draws itself in.
function spark(values, H = 300) {
  if (!values || values.length < 2) return '';
  const lo = Math.min(...values), hi = Math.max(...values), W = 840;
  const pts = values.map((y, i) => [(i / (values.length - 1)) * W + 8, H - ((y - lo) / (hi - lo || 1)) * (H - 30) - 8 + 15]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 856 ${H + 30}" preserveAspectRatio="none"><path class="sp" d="${d}" fill="none" stroke="#2B1B17" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><circle class="dot" cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="15" fill="#8E2F33" stroke="#2B1B17" stroke-width="6" opacity="0"/></svg>`;
}
const CAL = '<svg width="96" height="96" viewBox="0 0 48 48"><rect x="5" y="9" width="38" height="34" rx="6" fill="#FFF9F0" stroke="#2B1B17" stroke-width="4"/><path d="M5 19h38" stroke="#2B1B17" stroke-width="4"/><rect x="5" y="9" width="38" height="10" rx="4" fill="#8E2F33" stroke="#2B1B17" stroke-width="4"/><path d="M15 5v8M33 5v8" stroke="#2B1B17" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="31" r="5" fill="#8E2F33"/></svg>';

function sceneHtml(s) {
  return (s.beatLabel ? `<div class="pill">${esc(s.beatLabel)}</div>` : '') + body(s);
}

function body(s) {
  const v = s.visual;
  if (s.type === 'hero') {
    const svg = v.spark && v.spark.length > 1 ? `${spark(v.spark)}<div class="sl">${esc(v.sparkLabel)}</div>` : '';
    return `<div class="card"><div class="label">${esc(v.label)}</div><div class="big ${cls(v.sign)}">${esc(v.value)}</div><div class="sub">${esc(v.sub)}</div>${svg}</div>`;
  }
  if (s.type === 'headline') {
    return `<div class="card hl-card"><div class="kick">In the news</div><div class="hl">${esc(v.headline)}</div>${v.sources && v.sources.length ? `<div class="srcs">${esc(v.sources.join(' · '))}</div>` : ''}</div>`;
  }
  if (s.type === 'stat') {
    return `<div class="card stat-card"><div class="label">${esc(v.label)}</div><div class="big ${v.sign ? cls(v.sign) : ''}">${esc(v.value)}</div>${v.context ? `<div class="context">${esc(v.context)}</div>` : ''}${spark(v.spark, 200)}<div class="date">${esc(v.date || '')}</div></div>`;
  }
  if (s.type === 'ripple') {
    return `<div class="card from">${esc(v.from)}</div><svg class="down-arrow" width="120" height="120" viewBox="0 0 60 60"><path class="draw" d="M30 4v46M12 34l18 18 18-18" fill="none" stroke="#2B1B17" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><div class="tos">` +
      v.rows.map((r) => `<div class="card to"><div class="n">${esc(r.label)}</div><div class="v ${cls(r.move)}">${esc(r.value)}</div></div>`).join('') + '</div>';
  }
  if (s.type === 'watch') {
    return `<div class="heading">Coming up</div><div class="items">` + v.items.map((it) => `<div class="card item">${CAL}<div><div class="n">${esc(it.label)}</div><div class="w">${esc(it.when)}</div></div></div>`).join('') + '</div>';
  }
  if (s.type === 'bars') {
    const max = Math.max(...v.rows.map((r) => Math.abs(r.move)), 0.01);
    return `<div class="heading">${esc(v.heading)}</div><div class="note">${esc(v.note)}</div><div class="rows">` + v.rows.map((r) =>
      `<div class="row card"><div class="top"><div class="name">${esc(r.label)}<small>${esc(r.sub)}</small></div><div class="val ${cls(r.move)}">${esc(r.value)}</div></div><div class="track"><div class="fill bg-${cls(r.move)}" data-w="${(Math.abs(r.move) / max) * 100}"></div></div></div>`).join('') + '</div>';
  }
  if (s.type === 'stats') {
    return `<div class="heading">${esc(v.heading)}</div><div class="note">${esc(v.note)}</div><div class="tiles">` + v.tiles.map((t) =>
      `<div class="tile card"><div><div class="l">${esc(t.label)}</div><div class="h">${esc(t.hint)} · ${esc(t.date)}</div></div><div><div class="v">${esc(t.value)}</div><div class="p">${esc(t.prev)}</div></div></div>`).join('') + '</div>';
  }
  return `<div class="line">${esc(v.lines[0])}</div><svg class="arrow" viewBox="0 0 100 120" width="150" height="180"><path d="M50 112V14M14 50L50 12l36 38" fill="none" stroke="#8E2F33" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="line">${esc(v.lines[1])}</div>`;
}

window.setup = async (reel) => {
  R = reel;
  document.querySelector('#head .t').textContent = reel.title;
  document.querySelector('#head .d').textContent = reel.dateLabel;
  document.querySelector('#foot .s').textContent = reel.footer.source;
  document.querySelector('#foot .a').textContent = reel.footer.asOf;
  document.getElementById('scenes').innerHTML = reel.scenes.map((s, i) => `<div class="scene ${s.type} ${s.visual.compact ? 'compact' : ''}" data-i="${i}">${sceneHtml(s)}</div>`).join('');
  // Captions: groups of up to 3 words, breaking at punctuation, like the reference reel.
  chunks = [];
  reel.scenes.forEach((s) => {
    let cur = [];
    s.words.forEach((w, k) => {
      cur.push({ ...w, start: w.start + s.start, end: w.end + s.start });
      const next = s.words[k + 1];
      const glued = next && /^\d[\d,]*[.,!?;:]?$/.test(next.w) && !/[.,!?;:]$/.test(w.w) && cur.length < 4; // keep "Russell 2000" together
      if (((cur.length >= 3 || /[.,!?;:]$/.test(w.w)) && !glued) || k === s.words.length - 1) { chunks.push({ words: cur, start: cur[0].start, end: s.start + (s.words[k + 1]?.start ?? s.duration) }); cur = []; }
    });
  });
  await document.fonts.ready;
  window.seek(0);
};

window.seek = (t) => {
  document.querySelectorAll('.scene').forEach((el) => {
    const s = R.scenes[+el.dataset.i], lt = t - s.start;
    const on = lt >= 0 && lt < s.duration;
    const fadeIn = ease(lt / 0.35), fadeOut = s === R.scenes.at(-1) ? 1 : 1 - ease((lt - (s.duration - 0.25)) / 0.25);
    el.style.opacity = on ? Math.min(fadeIn, fadeOut) : 0;
    if (!on) return;
    el.style.transform = `translateY(${(1 - fadeIn) * 60}px) scale(${1 + (el.classList.contains('compact') ? 0 : 0.03) * clamp(lt / s.duration)})`; // slow push-in
    el.querySelectorAll('.row, .tile, .item').forEach((row, k) => {
      const p = ease((lt - 0.3 - k * (el.classList.contains('compact') ? 0.07 : 0.22)) / 0.45);
      row.style.opacity = p; row.style.transform = `translateX(${(1 - p) * -70}px)`;
      const f = row.querySelector('.fill'); if (f) f.style.width = (ease((lt - 0.55 - k * 0.12) / 0.8) * f.dataset.w) + '%';
    });
    el.querySelectorAll('.to').forEach((card, k) => {
      const p = ease((lt - 0.9 - k * 0.2) / 0.45);
      card.style.opacity = p; card.style.transform = `translateY(${(1 - p) * -50}px)`;
    });
    const draw = el.querySelector('.draw');
    if (draw) draw.style.strokeDashoffset = 1 - ease((lt - 0.35) / 0.5);
    const hl = el.querySelector('.hl');
    if (hl) { const p = ease((lt - 0.1) / 0.45); hl.style.opacity = p; hl.style.transform = `translateY(${(1 - p) * 30}px)`; }
    const sp = el.querySelector('.sp');
    if (sp) { const p = ease((lt - 0.5) / 2.2); sp.style.strokeDashoffset = 1 - p; el.querySelector('.dot').style.opacity = p > 0.98 ? 1 : 0; }
    const big = el.querySelector('.big');
    if (big) { const p = ease((lt - 0.15) / 0.5); big.style.transform = `scale(${0.6 + 0.4 * p})`; big.style.transformOrigin = '0 60%'; big.style.opacity = p; }
  });
  // The footer names the source of what is on screen right now.
  const now = R.scenes.find((s) => t >= s.start && t < s.start + s.duration) || R.scenes.at(-1);
  document.querySelector('#foot .s').textContent = now.sourceLine || R.footer.source;
  const c = chunks.find((c) => t >= c.start - 0.05 && t < c.end);
  document.getElementById('cap').innerHTML = c ? c.words.map((w) => `<span class="${t >= w.start ? 'on' : ''}">${esc(w.w)}</span>`).join('') : '';
  document.getElementById('bar').style.width = (clamp(t / R.duration) * 100) + '%';
};
</script>
</body>
</html>
