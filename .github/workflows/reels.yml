# Makes the reels on GitHub's computers and publishes them to the private site. This project is public, so that
# computer time is free. Started by an outside timer three times a day, or by hand from the Actions tab.
#   real         live market data from the private cloud store, real narrator voice, published to the private site
#   sample-data  the small sample in fixtures/ (public market numbers), real narrator voice, never published
#   dry          sample data, no voice, no AI, never published: the fastest free test
# Nothing private is kept on GitHub: finished reels and their narration go only to the private site.
name: Make reels

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to make'
        type: choice
        options: [real, sample-data, dry]
        default: real
      keep_video:
        description: 'Attach the finished video to this run for 1 day (sample data and dry runs only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ secrets.PAGES_PROJECT }}
      SITE_URL: ${{ secrets.SITE_URL }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Reuse the downloaded voice and listener models
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('pipeline/models.js') }}
      - name: Make and publish reels
        env:
          DRY_RUN: ${{ inputs.mode == 'dry' && '1' || '' }}
          USE_FIXTURE: ${{ inputs.mode != 'real' && '1' || '' }}
        run: node pipeline/run.js
      # Real reels are never attached here: anything attached to a run of a public project can be downloaded by others.
      - name: Attach the test video
        if: inputs.keep_video && inputs.mode != 'real'
        uses: actions/upload-artifact@v4
        with:
          name: test-reel
          path: |
            out/*.mp4
            out/*.jpg
          retention-days: 1
